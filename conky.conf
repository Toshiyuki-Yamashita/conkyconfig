conky.config = {
    lua_load = os.getenv("HOME") .. '/.config/conky/load.lua',
    alignment = 'top_right',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'IBM Plex Mono:size=12',
    gap_x = 30,
    gap_y = 60,
    minimum_height = 5,
    minimum_width = 5,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_hints= 'undecorated,below,sticky,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 2.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 150,
}

conky.text = [[
${color grey}Info: ${lua env_get DISTRIB_DESCRIPTION} (${kernel}) $color
$hr
${color grey}Uptime:$color $uptime
${color grey}Load: ${loadgraph 20,120 888888 FFFFFF -l}
$hr
${color grey}CPU:
 ${color grey}Usage:$color ${cpu cpu0}% ${cpubar cpu0} 
 ${cpugraph cpu0} 
 ${color grey}1:${cpu cpu1}%${cpugraph cpu1 20,130 000000 ffffff} ${color grey}2:${cpu cpu2}%${cpugraph cpu2 20,130 000000 ffffff}
 ${color grey}3:${cpu cpu3}%${cpugraph cpu3 20,130 000000 ffffff} ${color grey}4:${cpu cpu4}%${cpugraph cpu4 20,130 000000 ffffff}
 ${color grey}5:${cpu cpu5}%${cpugraph cpu5 20,130 000000 ffffff} ${color grey}6:${cpu cpu6}%${cpugraph cpu6 20,130 000000 ffffff}
 ${color grey}7:${cpu cpu7}%${cpugraph cpu7 20,130 000000 ffffff} ${color grey}8:${cpu cpu8}%${cpugraph cpu8 20,130 000000 ffffff}
 ${color grey}9:${cpu cpu9}%${cpugraph cpu9 20,130 000000 ffffff} ${color grey}10:${cpu cpu10}%${cpugraph cpu10 20,130 000000 ffffff}
 ${color grey}11:${cpu cpu11}%${cpugraph cpu11 20,130 000000 ffffff} ${color grey}12:${cpu cpu12}%${cpugraph cpu12 20,130 000000 ffffff}
 ${color grey}Core 0: ${freq_g 1}GHz ${execi 5 sensors | grep 'Core 0' | cut -c16-20}${font "IBM Plex Sans JP":size=8}℃ $font 
 ${color grey}Core 1: ${freq_g 2}GHz ${execi 5 sensors | grep 'Core 1' | cut -c16-20}${font "IBM Plex Sans JP":size=8}℃ $font
 ${color grey}Core 2: ${freq_g 3}GHz ${execi 5 sensors | grep 'Core 2' | cut -c16-20}${font "IBM Plex Sans JP":size=8}℃ $font 
 ${color grey}Core 3: ${freq_g 4}GHz ${execi 5 sensors | grep 'Core 3' | cut -c16-20}${font "IBM Plex Sans JP":size=8}℃ $font
 ${color grey}Core 4: ${freq_g 5}GHz ${execi 5 sensors | grep 'Core 4' | cut -c16-20}${font "IBM Plex Sans JP":size=8}℃ $font
 ${color grey}Core 5: ${freq_g 6}GHz ${execi 5 sensors | grep 'Core 5' | cut -c16-20}${font "IBM Plex Sans JP":size=8}℃ $font
$hr
${color grey}RAM:
 ${color grey}Used/Capacity: $color $mem/$memmax - $memperc% 
 ${color grey}${membar}
$hr
${color grey}GPU: ${nvidia modelname 0} (${nvidia driverversion 0}) $color
 ${color grey}Usage:    ${color grey} ${nvidia gpuutil 0} % ${nvidiagraph gpuutil 0}
 ${color grey}RAM:      ${color grey} ${nvidia memutil 0} % ${nvidiagraph memutil 0}
 ${color grey}GPU Temp: ${color grey} ${nvidia temp 0} ${font "IBM Plex Sans JP":size=8}℃$font ${nvidiagraph temp 0}
 ${color grey}Fan:      ${color grey} ${nvidia fanlevel 0} % ${nvidiagraph fanlevel 0}
$hr
${color grey}File systems:
 / $color${fs_used /}/${fs_size /} ${fs_bar 6 /}
 ~ $color${fs_used /home/buffie}/${fs_size /home/buffie} ${fs_bar 6 /home/buffie}
$hr
${color grey}Networking:
 ${color grey}Address: ${color grey} ${addr enp3s0}
 ${color grey}Up:   ${upspeedf enp3s0} Kpbs $color ${upspeedgraph enp3s0} 
 ${color grey}Down: ${downspeedf enp3s0} Kbps $color ${downspeedgraph enp3s0}
$hr
${color grey}Processes:$color $processes  ${color grey}Running:$color $running_processes
${color grey} Name                 PID     CPU%   MEM%
${color lightgrey} ${top name 1} ${top pid 1} ${top cpu 1} ${top mem 1}
${color lightgrey} ${top name 2} ${top pid 2} ${top cpu 2} ${top mem 2}
${color lightgrey} ${top name 3} ${top pid 3} ${top cpu 3} ${top mem 3}
${color lightgrey} ${top name 4} ${top pid 4} ${top cpu 4} ${top mem 4}
]]
