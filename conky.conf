    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = theme.font.default.spec,
    gap_x = theme.layout.gap_x,
    gap_y = theme.layout.gap_y,
    minimum_height = theme.layout.minimum_height,
    minimum_width = theme.layout.minimum_width,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
