local conky_dir = os.getenv("HOME") .. '/.config/conky'
local theme = dofile(conky_dir .. '/theme.lua')

local function render_template(text, values)
    return (text:gsub('{{([%w_]+)}}', values))
end

local home_dir = os.getenv("HOME") or '/'

local function build_cpu_usage_lines()
    local cpu_count = 0
    for line in io.lines('/proc/stat') do
        if line:match('^cpu%d+%s') then
            cpu_count = cpu_count + 1
        end
    end

    local lines = {}
    local i = 1
    while i <= cpu_count do
        local function one(idx)
            return string.format(
                '${color %s}%d:${cpu cpu%d}%%${cpugraph cpu%d %d,%d %s %s}',
                theme.colors.label, idx, idx, idx,
                theme.layout.graph_height, theme.layout.cpu_graph_width,
                theme.colors.graph_background, theme.colors.graph_foreground
            )
        end
        local row = ' ' .. one(i)
        if i + 1 <= cpu_count then
            row = row .. ' ' .. one(i + 1)
        end
        table.insert(lines, row)
        i = i + 2
    end
    return table.concat(lines, '\n')
end

local text_values = {
    label_color = '${color ' .. theme.colors.label .. '}',
    process_color = '${color ' .. theme.colors.process .. '}',
    load_graph = string.format(
        '${loadgraph %d,%d %s %s -l}',
        theme.layout.graph_height,
        theme.layout.load_graph_width,
        theme.colors.load_graph_background,
        theme.colors.load_graph_foreground
    ),
    fs_bar_root = string.format('${fs_bar %d /}', theme.layout.fs_bar_height),
    fs_bar_home = string.format(
        '${fs_bar %d %s}',
        theme.layout.fs_bar_height,
        home_dir
    ),
    home_dir = home_dir,
    symbol_font = theme.font.symbol.conky,
    temperature_unit = theme.text.temperature_unit,
    network_interface = theme.network.interface,
    cpu_usage_lines = build_cpu_usage_lines(),
}

